<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collaborative Cooking — kitchen pass</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #16110d; color: #f2e8d8; }
  main { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
  header { padding: 10px 16px; background: #241a12; display: flex; gap: 14px; align-items: baseline; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
  .pill { padding: 3px 9px; background: #33251a; border-radius: 6px; font-size: 12px; }
  .dishes { color: #e8a33d; font-size: 22px; font-weight: 700; }
  section { padding: 12px 16px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .cog { background: #241a12; border-left: 3px solid var(--sc, #8a7f72); border-radius: 4px; padding: 8px 10px; }
  .cog b { display: block; font-size: 15px; }
  .cog span { display: block; font-size: 12px; color: #b8ac98; }
  .board { padding: 0 16px 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .board div { background: #241a12; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
  ul { margin: 0; padding: 0 16px 24px 32px; }
  li { font-size: 12px; color: #b8ac98; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Collaborative Cooking</h1>
    <span class="pill" id="status">connecting</span>
    <span class="pill" id="layout">—</span>
    <span class="pill" id="tick">tick —</span>
    <span class="dishes" id="dishes">0</span><span class="pill">dishes</span>
  </header>
  <section id="cogs"></section>
  <div class="board" id="board"></div>
  <ul id="feed"></ul>
</main>
<script>
const COLOURS = ["#e8a33d", "#3f7cc4", "#45a85e", "#e0523a"];
function socketUrl(path) {
  const params = new URLSearchParams(window.location.search);
  if (params.has("address")) {
    const direct = new URL(params.get("address"), window.location.href);
    direct.protocol = direct.protocol === "https:" ? "wss:" : "ws:";
    return direct.toString();
  }
  const url = new URL(window.location.href);
  url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
  url.pathname = path;
  url.search = "";
  return url.toString();
}
const $ = id => document.getElementById(id);
const socket = new WebSocket(socketUrl("/global"));
socket.onopen = () => { $("status").textContent = "connected"; };
socket.onclose = () => { $("status").textContent = "closed"; };
socket.onmessage = event => {
  const state = JSON.parse(event.data);
  $("layout").textContent = state.layout || "—";
  $("tick").textContent = "tick " + (state.step ?? "—") + " / " + (state.max_steps ?? "—");
  $("dishes").textContent = state.dishes ?? 0;
  $("cogs").innerHTML = (state.cogs || []).map((cog, i) =>
    `<div class="cog" style="--sc:${COLOURS[i % COLOURS.length]}">
       <b>${cog.alias || ""}</b>
       <span>${cog.name || ""} · ${cog.kind || ""}</span>
       <span>at (${cog.y},${cog.x}) carrying ${cog.carrying || "nothing"}</span>
       <span>${(state.delivered || [])[i] ?? 0} dishes${cog.connected ? "" : " · disconnected"}</span>
       ${cog.say ? `<span>“${cog.say}”</span>` : ""}
     </div>`).join("");
  const stations = state.stations || {};
  const board = stations.board || {};
  $("board").innerHTML = [
    `orders — salad ${board.salad ?? 0} · soup ${board.soup ?? 0} · fries ${board.fries ?? 0}`,
    `pot — ${(stations.pot || {}).state || "idle"} (${(stations.pot || {}).timer ?? 0})`,
    `fryer — ${(stations.fryer || {}).state || "idle"} (${(stations.fryer || {}).timer ?? 0})`,
    `chopping — veg ${(stations.chop || {}).veg ?? 0} · meat ${(stations.chop || {}).meat ?? 0}`,
    `sink — ${(stations.sink || {}).wash ?? 0}/3`,
  ].map(text => `<div>${text}</div>`).join("");
  $("feed").innerHTML = (state.feed || []).slice(-8).map(line =>
    `<li>${line.t}: ${line.text}</li>`).join("");
};
</script>
</body>
</html>
